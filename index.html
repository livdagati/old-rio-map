<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Río de la Plata</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, sans-serif; }
  .panel { background: #fffdf7; padding: 10px 12px; border-radius: 8px;
           box-shadow: 0 1px 6px rgba(0,0,0,.25); max-width: 220px; }
  .panel h1 { font-size: 15px; margin: 0 0 6px; }
  .panel button { display: block; width: 100%; margin: 3px 0; padding: 5px;
                  border: 1px solid #c9bfa8; background: #f4efe2; border-radius: 4px; cursor: pointer; }
  .panel button:hover { background: #e9e0c9; }
  .panel label { display: block; margin-top: 8px; }
  .panel input[type=range] { width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { minZoom: 4, maxZoom: 18 }).setView([-32.5, -55.5], 6);

// Modern map underneath, so you can compare old vs. new
const modern = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19
}).addTo(map);

// The combined old-map tiles (1865 region, 1920 Uruguay, 1867 Montevideo, 1887 Buenos Aires)
const old = L.tileLayer('tiles/{z}/{x}/{y}.webp', {
  maxNativeZoom: 17, maxZoom: 18, opacity: 1,
  bounds: [[-37.1, -61.8], [-23.0, -49.1]],
  attribution: 'Old maps: BnF Gallica / Wikimedia Commons (public domain)'
}).addTo(map);

const places = {
  'Rio Grande do Sul & Uruguay': [[-31.5, -55.0], 6],
  'Uruguay (1920)':             [[-32.6, -56.0], 7],
  'Rio Grande (city)':          [[-32.05, -52.1], 11],
  'Montevideo (1867)':          [[-34.895, -56.205], 14],
  'Buenos Aires (1887)':        [[-34.607, -58.39], 14],
};

const Panel = L.Control.extend({
  onAdd() {
    const d = L.DomUtil.create('div', 'panel');
    d.innerHTML = '<h1>Old Río de la Plata</h1>';
    for (const [name, [c, z]] of Object.entries(places)) {
      const b = L.DomUtil.create('button', '', d);
      b.textContent = name;
      b.onclick = () => map.flyTo(c, z);
    }
    d.insertAdjacentHTML('beforeend',
      '<label>Old map opacity <input id="op" type="range" min="0" max="1" step="0.05" value="1"></label>');
    L.DomEvent.disableClickPropagation(d);
    d.querySelector('#op').oninput = e => old.setOpacity(+e.target.value);
    return d;
  }
});
new Panel({ position: 'topright' }).addTo(map);
L.control.scale().addTo(map);
</script>
</body>
</html>
